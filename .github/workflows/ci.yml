name: CI
# Runs on every push and pull request: story test (every path), typecheck, build, browser playthroughs.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Story test + typecheck + build
        run: npm run build
      - name: Install browser for playthrough tests
        run: npm i --no-save playwright && npx playwright install --with-deps chromium
      - name: Browser playthroughs (phone viewport)
        run: npm run test:e2e
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: reports/
